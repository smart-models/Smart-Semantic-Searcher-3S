  <text x="689" y="347" text-anchor="middle" fill="#c1d8f4" font-size="10" font-weight="600" letter-spacing=".8">OPTIONAL</text>
  <text x="454" y="380" class="small">28 tools · resources · prompts</text>
  <rect x="656" y="362" width="68" height="26" rx="8" fill="#0b2038" stroke="#315b84"/>
  <text x="690" y="380" text-anchor="middle" class="mono blue">:6337</text>

  <!-- Primary API and orchestration. -->
  <rect x="72" y="438" width="676" height="116" rx="20" stroke="#4b9af0" stroke-opacity=".10" stroke-width="7"/>
  <rect x="76" y="442" width="668" height="108" rx="16" fill="url(#middleware-fill)" stroke="url(#middleware-stroke)" stroke-width="1.2"/>
  <rect x="94" y="461" width="42" height="42" rx="12" fill="#255a91"/>
  <use href="#middleware-icon" x="101" y="466" color="#d8edff"/>
  <text x="152" y="480" class="heading" font-size="27" letter-spacing="-.4">Qdrant middleware</text>
  <text x="152" y="503" class="mono" fill="#9cc7f1">middleware-qdrant-manager</text>
  <text x="152" y="530" class="body" style="fill: #c5daf0; font-size: 14px">Ingest · hybrid search · reranking · collection lifecycle</text>
  <rect x="656" y="460" width="68" height="26" rx="8" fill="#0b2038" stroke="#315b84"/>
  <text x="690" y="478" text-anchor="middle" class="mono blue">:6336</text>

  <!-- Local model execution. -->
  <rect x="72" y="598" width="676" height="114" rx="20" stroke="#4b9af0" stroke-opacity=".10" stroke-width="7"/>
  <rect x="76" y="602" width="668" height="106" rx="16" fill="url(#emb-fill)" stroke="url(#emb-stroke)" stroke-width="1.2"/>
  <rect x="94" y="621" width="42" height="42" rx="12" fill="#24527f"/>
  <use href="#chip-icon" x="100" y="627" color="#cfe6ff"/>
  <text x="152" y="639" class="heading" font-size="26" letter-spacing="-.4">Smart Embedder</text>
  <text x="152" y="662" class="mono" fill="#a4c6e6">server-embedder-reranker</text>
  <text x="152" y="688" class="body" style="font-size: 14px">Local models · dense + sparse vectors · cross-encoder reranking</text>
  <rect x="656" y="620" width="68" height="26" rx="8" fill="#0b2038" stroke="#3a628c"/>
  <text x="690" y="638" text-anchor="middle" class="mono blue">:8010</text>
  <text x="724" y="662" text-anchor="end" class="small">basic / advanced</text>

  <text x="64" y="728" class="eyebrow" style="font-size: 10px; letter-spacing: 1px">ONE COMPOSE · EVERY PORT ON 127.0.0.1</text>
  <text x="756" y="728" text-anchor="end" class="eyebrow" style="font-size: 10px; letter-spacing: 1px">CPU OR NVIDIA GPU</text>

  <!-- Qdrant is provided by the operator, outside the managed stack. -->
  <text x="846" y="418" class="eyebrow" style="fill: #c4818f">EXTERNAL DEPENDENCY</text>
  <rect x="846" y="442" width="314" height="220" rx="16" fill="url(#qdrant-fill)" stroke="#7a3247"/>
  <rect x="864" y="461" width="42" height="42" rx="12" fill="#4d1628"/>
  <use href="#database-icon" x="870" y="467" color="#ff9aab"/>
  <text x="921" y="489" class="heading" font-size="28" letter-spacing="-.4">Qdrant</text>
  <text x="870" y="532" class="body">Vector storage</text>
  <text x="870" y="558" class="body">Dense + sparse fusion</text>
  <line x1="870" y1="579" x2="1136" y2="579" stroke="#4a2029"/>
  <text x="870" y="606" class="qdrant" font-size="14" font-weight="600">Your instance</text>
  <rect x="1068" y="588" width="68" height="26" rx="8" fill="#241019" stroke="#7a3247"/>
  <text x="1102" y="606" text-anchor="middle" class="mono qdrant">:6333</text>
  <text x="870" y="637" class="small" style="fill: #bf94a0">Local or remote · QDRANT_URL</text>
  <text x="846" y="689" class="small">Connected by 3S.</text>
  <text x="846" y="710" class="small">Deployed separately by you.</text>

  <!-- A compact reading guide for the retrieval sequence. -->
  <rect x="40" y="762" width="1120" height="62" rx="14" fill="#111f31" stroke="#263a52"/>
  <text x="62" y="798" class="eyebrow" style="fill: #b0c4dc">ONE SEARCH</text>
  <line x1="168" y1="780" x2="168" y2="806" stroke="#31475f"/>
  <circle cx="198" cy="793" r="12" fill="#203d60"/>
  <text x="198" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">1</text>
  <text x="220" y="798" class="body" style="fill: #d4e1f2">Embed query</text>
  <use href="#step-arrow" x="345" y="793"/>
  <circle cx="408" cy="793" r="12" fill="#203d60"/>
  <text x="408" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">2</text>
  <text x="430" y="798" class="body" style="fill: #d4e1f2">Retrieve + fuse</text>
  <use href="#step-arrow" x="575" y="793"/>
  <circle cx="638" cy="793" r="12" fill="#203d60"/>
  <text x="638" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">3</text>
  <text x="660" y="798" class="body" style="fill: #d4e1f2">Rerank candidates</text>
  <use href="#step-arrow" x="831" y="793"/>
  <circle cx="894" cy="793" r="12" fill="#203d60"/>
  <text x="894" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">4</text>
  <text x="916" y="798" class="body" style="fill: #d4e1f2">Return ranked hits</text>
</svg>
