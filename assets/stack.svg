      <rect x="11" y="11" width="8" height="8" rx="2"/>
      <path d="M10 2v4m10-4v4M10 24v4m10-4v4M2 10h4m-4 10h4m18-10h4m-4 10h4"/>
    </g>
    <g id="database-icon" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="15" cy="7" rx="12" ry="5"/>
      <path d="M3 7v16c0 2.8 5.4 5 12 5s12-2.2 12-5V7M3 15c0 2.8 5.4 5 12 5s12-2.2 12-5"/>
    </g>
    <g id="step-arrow" stroke="#55708f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0h21m-5-5 5 5-5 5"/>
    </g>
  </defs>

  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .heading { fill: #f0f6ff; font-weight: 600; }
    .body { fill: #b4c6de; font-size: 15px; }
    .small { fill: #94acc8; font-size: 13px; }
    .eyebrow { fill: #91abc9; font-size: 11px; font-weight: 600; letter-spacing: 1.6px; }
    .mono { font-family: Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .blue { fill: #8bc5ff; }
    .qdrant { fill: #ff8fa3; }
    .connector { stroke: #7bb9fb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Self-contained artwork: no remote assets, fonts, or scripts. -->
  <rect x=".5" y=".5" width="1199" height="849" rx="24" fill="url(#background)" stroke="#24364e"/>
  <rect x="24" y="156" width="1152" height="580" rx="20" fill="url(#dots)"/>
  <rect x="24" y="156" width="1152" height="580" rx="20" fill="url(#ambient)"/>

  <!-- Product identity. -->
  <text x="410" y="44" text-anchor="middle" class="eyebrow" style="fill: #8bc5ff">SMART SEMANTIC SEARCHER</text>
  <text x="410" y="96" text-anchor="middle" class="heading" font-size="40" letter-spacing="-.9">One stack. Smarter retrieval.</text>
  <text x="410" y="128" text-anchor="middle" class="body" style="font-size: 17px">Local models, hybrid search, and a direct path for apps and agents.</text>
  <g transform="translate(1100 36) scale(.46)">
    <circle cx="64" cy="64" r="64" fill="#050a12" stroke="#29405b" stroke-width="2"/>
    <g stroke-width="12.73" stroke-linecap="round">
      <path d="M31.24 38.31A15.0492 15.0492 0 1 1 41.88 64A15.0492 15.0492 0 1 1 31.24 89.69" stroke="#2e6db4"/>
      <path d="M92.35 38.31A15.0492 15.0492 0 1 0 81.71 64A15.0492 15.0492 0 1 1 71.07 89.69" stroke="#5aa9ff"/>
    </g>
  </g>

  <!-- The boundary contains only services managed by this project. -->
  <rect x="40" y="286" width="740" height="450" rx="20" fill="#101e31" fill-opacity=".62" stroke="#344c69" stroke-dasharray="4 7"/>
  <text x="64" y="312" class="eyebrow">3S DOCKER STACK</text>

  <!-- Calls flow downward; Qdrant remains a separate dependency. -->
  <path d="M231 252V435" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M589 252V311" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M589 398V435" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M410 550V595" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M744 496H839" class="connector" marker-end="url(#arrow-blue)"/>

  <rect x="245" y="350" width="51" height="25" rx="7" fill="#13263d"/>
  <text x="270.5" y="367" text-anchor="middle" class="mono blue">REST</text>
  <rect x="599" y="273.5" width="116" height="25" rx="7" fill="#13263d"/>
  <text x="657" y="291" text-anchor="middle" class="small blue">MCP over HTTP</text>
  <rect x="599" y="408" width="51" height="25" rx="7" fill="#13263d"/>
  <text x="624.5" y="425" text-anchor="middle" class="mono blue">REST</text>
  <rect x="421" y="564" width="114" height="25" rx="7" fill="#13263d"/>
  <text x="478" y="581" text-anchor="middle" class="small blue">embed + rerank</text>
  <rect x="766" y="464" width="58" height="25" rx="7" fill="#13263d"/>
  <text x="795" y="481" text-anchor="middle" class="mono blue">query</text>
  <rect x="755" y="501" width="80" height="25" rx="7" fill="#13263d"/>
  <text x="795" y="518" text-anchor="middle" class="mono blue">+ upsert</text>

  <!-- Entry points. -->
  <rect x="76" y="174" width="310" height="78" rx="14" fill="url(#entry-fill)" stroke="url(#entry-stroke)" stroke-width="1.2"/>
  <rect x="92" y="191" width="44" height="44" rx="12" fill="#1b5753"/>
  <use href="#browser-icon" x="100" y="199" color="#b9f2e8"/>
  <text x="151" y="206" class="heading" font-size="21">Your application</text>
  <text x="151" y="230" class="small" style="fill: #9fc9c5">Any language + HTTP client</text>

  <rect x="434" y="174" width="310" height="78" rx="14" fill="url(#entry-fill)" stroke="url(#entry-stroke)" stroke-width="1.2"/>
  <rect x="450" y="191" width="44" height="44" rx="12" fill="#1b5753"/>
  <use href="#agent-icon" x="458" y="198" color="#b9f2e8"/>
  <text x="509" y="206" class="heading" font-size="21">Your AI agent</text>
  <text x="509" y="230" class="small" style="fill: #9fc9c5">MCP client + Smart-Skill</text>

  <!-- Optional translation layer. -->
  <rect x="430" y="314" width="318" height="88" rx="18" stroke="#4b9af0" stroke-opacity=".10" stroke-width="7"/>
  <rect x="434" y="318" width="310" height="80" rx="14" fill="url(#mcp-fill)" stroke="url(#mcp-stroke)" stroke-width="1.2"/>
  <use href="#bridge-icon" x="452" y="331" color="#bcd9ff"/>
